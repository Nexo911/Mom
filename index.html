<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feliz Cumpleaños Mamá 💖</title>

<style>

body{
  margin:0;
  background:pink;
  font-family:Arial, sans-serif;
  text-align:center;
}

/* CONTENEDOR */
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

h1{
  color:white;
  font-size:clamp(26px,6vw,42px);
  text-shadow:2px 2px 6px rgba(0,0,0,.25);
}

p{
  color:white;
  font-size:clamp(16px,4vw,22px);
}

/* BEAR */
#bear{
  width:min(300px,80vw);
  margin:20px 0;
  cursor:pointer;
}

/* SLIDESHOW */
.slideshow img{
  width:min(420px,90vw);
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
  margin-top:15px;
}

/* GALERIA */
.gallery{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
}

.gallery img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
  transition:.3s;
}

.gallery img:hover{
  transform:scale(1.05);
  box-shadow:0 8px 20px rgba(0,0,0,.3);
}

/* VISOR GRANDE */
#viewer{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
}

#viewer img{
  max-width:90%;
  max-height:90%;
  border-radius:15px;
}

</style>
</head>

<body>

<div class="container">

<h1>🎂 Feliz Cumpleaños Mamá 💖</h1>

<p>
Gracias por todo lo que haces por nosotros.<br>
Eres una persona increíble y te queremos muchísimo.<br>
Hoy celebramos tu vida y todos los momentos hermosos juntos 🌸✨
</p>

<!-- BEAR -->
<img id="bear" src="bear.gif" alt="Bear feliz">

<!-- SLIDESHOW AUTOMÁTICO -->
<div class="slideshow">
  <img id="slide" src="Screenshot_20260223_104029_Facebook.jpg">
</div>

<!-- GALERÍA -->
<div class="gallery">
  <img src="Screenshot_20260223_104029_Facebook.jpg">
  <img src="Screenshot_20260223_104133_Facebook.jpg">
  <img src="Screenshot_20260223_104319_Facebook.jpg">
  <img src="Screenshot_20260223_104340_Facebook.jpg">
  <img src="Screenshot_20260223_104554_Facebook.jpg">
  <img src="Screenshot_20260223_104604_Facebook.jpg">
  <img src="Screenshot_20260223_104724_Facebook.jpg">
  <img src="Screenshot_20260223_104740_Facebook.jpg">
  <img src="Screenshot_20260223_104801_Facebook.jpg">
</div>

</div>

<!-- VISOR -->
<div id="viewer">
  <img id="bigImage">
</div>

<script>

/* -------- GIF BEAR -------- */
const bear=document.getElementById("bear");

function restartGif(){
  const src=bear.src;
  bear.src="";
  bear.src=src;
}
window.onload=restartGif;
bear.onclick=restartGif;


/* -------- SLIDESHOW -------- */
const photos=[
"Screenshot_20260223_104029_Facebook.jpg",
"Screenshot_20260223_104133_Facebook.jpg",
"Screenshot_20260223_104319_Facebook.jpg",
"Screenshot_20260223_104340_Facebook.jpg",
"Screenshot_20260223_104554_Facebook.jpg",
"Screenshot_20260223_104604_Facebook.jpg",
"Screenshot_20260223_104724_Facebook.jpg",
"Screenshot_20260223_104740_Facebook.jpg",
"Screenshot_20260223_104801_Facebook.jpg"
];

let index=0;
const slide=document.getElementById("slide");

setInterval(()=>{
  index=(index+1)%photos.length;
  slide.src=photos[index];
},3000);


/* -------- VISOR DE FOTOS -------- */
const viewer=document.getElementById("viewer");
const bigImage=document.getElementById("bigImage");

document.querySelectorAll(".gallery img").forEach(img=>{
  img.addEventListener("click",()=>{
    bigImage.src=img.src;
    viewer.style.display="flex";
  });
});

viewer.addEventListener("click",()=>{
  viewer.style.display="none";
});

</script>

</body>
</html>
